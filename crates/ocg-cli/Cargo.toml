[package]
name = "ocg-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Headless CLI for Open Console Gateway"

[features]
default = ["dsh-local-host"]
dsh-local-host = ["ocg-core/dsh-local-host"]
ollama-cloud-loopback-test = ["ocg-core/ollama-cloud-loopback-test"]

[[bin]]
name = "ocg"
path = "src/main.rs"

[dependencies]
ocg-core = { path = "../ocg-core" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
