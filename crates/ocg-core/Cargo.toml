[package]
name = "ocg-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core library for Open Console Gateway, account management, cooldown, and fallback"

[features]
default = []
dsh-local-host = ["reqwest/blocking", "dep:serde_yaml_ng"]
# Loopback-only Ollama Cloud origin substitute for gateway integration tests.
# Default-off so application builds keep the fixed https://ollama.com origin.
ollama-cloud-loopback-test = []

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.3"
ocg-domain = { path = "../ocg-domain", features = ["schemars"] }
ocg-gateway = { path = "../ocg-gateway" }
ocg-infra = { path = "../ocg-infra" }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-webpki-roots",
] }
rusqlite = { version = "0.33", features = ["bundled"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = { version = "0.10", optional = true }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
# Match Windows browser trust/proxy behavior while retaining WebPKI roots as a fallback.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "system-proxy",
] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
