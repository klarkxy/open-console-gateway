name: Prepare quota latency fix

on:
  push:
    branches: [fix/account-quota-refresh-latency]
    paths:
      - .github/workflows/prepare-quota-fix.yml
      - scripts/prepare-quota-fix.mjs

permissions:
  contents: write

concurrency:
  group: prepare-quota-fix
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'klarkxy/open-console-gateway' && github.ref == 'refs/heads/fix/account-quota-refresh-latency'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.29.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - name: Apply reviewed changes and remove temporary preparation files
        run: node scripts/prepare-quota-fix.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run contract:v3:check && pnpm run contract:v4:check
      - run: pnpm run test:web
      - run: pnpm run test:tooling
      - run: pnpm run build:web
      - name: Commit validated changes to the repair branch only
        run: |
          git diff --check
          git add src docs/user/accounts.md docs/user/accounts.zh-CN.md scripts/prepare-quota-fix.mjs .github/workflows/prepare-quota-fix.yml
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(accounts): decouple quota refresh, parallelize snapshots, and preserve CAS'
          git push origin HEAD:refs/heads/fix/account-quota-refresh-latency
