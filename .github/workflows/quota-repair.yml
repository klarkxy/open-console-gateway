name: Quota repair workspace

on:
  push:
    branches: [fix/account-quota-refresh-latency]
    paths: [.github/workflows/quota-repair.yml, scripts/quota-repair.py]

permissions:
  contents: read

concurrency:
  group: quota-repair-workspace
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  workspace:
    if: github.repository == 'klarkxy/open-console-gateway'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.29.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: quality-linux
          workspaces: ". -> target"
          cache-on-failure: true
      - name: Apply scoped repair
        run: |
          if test ! -f crates/ocg-core/src/usage_sync/singleflight.rs; then
            python3 scripts/quota-repair.py
          fi
          cargo fmt --all
      - run: pnpm install --frozen-lockfile
      - name: Generate contracts
        run: pnpm run contract:v4:generate
      - name: Focused Rust verification
        run: |
          set -o pipefail
          cargo check -p ocg-core --no-default-features --locked 2>&1 | tee "$RUNNER_TEMP/quota-check.log"
          cargo test -p ocg-core --lib --locked singleflight 2>&1 | tee -a "$RUNNER_TEMP/quota-check.log"
          cargo test -p ocg-core --lib --locked billing 2>&1 | tee -a "$RUNNER_TEMP/quota-check.log"
          cargo test -p ocg-core --test dashboard_v3_ollama_usage --locked --features ollama-cloud-loopback-test 2>&1 | tee -a "$RUNNER_TEMP/quota-check.log"
      - name: Focused Web verification
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee "$RUNNER_TEMP/quota-web.log"
          pnpm run test:web 2>&1 | tee -a "$RUNNER_TEMP/quota-web.log"
          pnpm run contract:v3:check
          pnpm run contract:v4:check
      - name: Commit verified source to the existing PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/account-quota-refresh-latency
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates src schema docs
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'fix: cache Rust billing snapshots and coalesce balance refreshes'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/account-quota-refresh-latency
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Collect repair diagnostics and exact worktree
        if: always()
        run: |
          git diff --stat > "$RUNNER_TEMP/quota-diff.txt"
          git diff --check >> "$RUNNER_TEMP/quota-diff.txt" || true
          git ls-files -z --cached --others --exclude-standard | tar --null -T - -czf "$RUNNER_TEMP/quota-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quota-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/quota-source.tar.gz
            ${{ runner.temp }}/quota-check.log
            ${{ runner.temp }}/quota-web.log
            ${{ runner.temp }}/quota-diff.txt
          retention-days: 1
