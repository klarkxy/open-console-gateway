name: Finalize Go catalog patch (no tests)

on:
  push:
    branches: [fix/go-catalog-publication-20260918]
    paths: [.github/workflows/apply-go-catalog-fix-20260918.yml]
permissions:
  contents: write
concurrency:
  group: apply-go-catalog-fix-20260918
  cancel-in-progress: false
jobs:
  finalize:
    if: github.ref == 'refs/heads/fix/go-catalog-publication-20260918'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: fix/go-catalog-publication-20260918
      - name: Normalize added template indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = 'b2d045a2a714839a3cb7909c28141243724d5e01'
          assert not subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD', '--', 'crates', 'src', 'docs'], text=True).strip()
          p = Path('src/components/ProviderModelMatrix.vue')
          text = p.read_text()
          start = text.index('              <div v-else class="matrix-chips">')
          end = text.index('\n            </td>', start)
          lines = text[start:end].splitlines()
          assert lines[-1] == '    </div>'
          lines = [lines[0]] + ['          ' + line for line in lines[1:]]
          p.write_text(text[:start] + '\n'.join(lines) + text[end:])
          PY
      - name: Format Rust and check the final patch without building or testing
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --version
          git diff --name-only 352dabaa8a682a4661ef38b177713c91543e67cc -- '*.rs' | while IFS= read -r file; do
            rustfmt --edition 2024 --config skip_children=true "$file"
          done
          git add -- crates src docs
          git rm -- scripts/apply-go-catalog-fix-20260918.py .github/workflows/apply-go-catalog-fix-20260918.yml
          git diff --cached --check
          git diff --cached --stat 352dabaa8a682a4661ef38b177713c91543e67cc
      - name: Publish a clean single-commit repair branch
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/go-catalog-publication-ready-20260918
          if [ -n "$(git ls-remote --heads origin "refs/heads/$branch")" ]; then
            echo 'Delivery branch already exists; refusing to replace it'
            exit 1
          fi
          tree=$(git write-tree)
          message='fix: decouple Go catalog discovery and preserve protocol configuration [skip ci]'
          commit=$(printf '%s\n\n%s\n' "$message" 'Keyless catalog refresh, exact Go model publication, runtime UI inventory, explicit unknown-protocol selection, and non-destructive document refresh. Tests and compilation were not run; Rust formatting and whitespace validation only.' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p 352dabaa8a682a4661ef38b177713c91543e67cc)
          git push origin "$commit:refs/heads/$branch"
          echo "Delivery commit: $commit"
          echo "Delivery tree: $tree"
