name: DSH metadata feature validation
on:
  push:
    branches: [feat/dsh-model-metadata]
permissions:
  contents: write
concurrency:
  group: ocg-dsh-model-metadata-bootstrap
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  validate:
    if: github.repository == 'klarkxy/open-console-gateway' && github.ref == 'refs/heads/feat/dsh-model-metadata'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/dsh-model-metadata
      - name: Apply and checkpoint reviewed edits
        run: |
          if test -f scripts/bootstrap-dsh-metadata.py; then
            python3 scripts/bootstrap-dsh-metadata.py
            rm scripts/bootstrap-dsh-metadata.py
          fi
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates integrations scripts docs
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m 'feat: connect route metadata discovery and DSH model profiles'
            git push origin HEAD:refs/heads/feat/dsh-model-metadata
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.29.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: quality-linux
          workspaces: '. -> target'
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run contract:v4:generate
      - run: node --test scripts/dsh-model-catalog.test.mjs scripts/dsh-plugin-package.test.mjs
      - run: cargo test -p ocg-core --lib --locked --features ollama-cloud-loopback-test model_metadata
      - run: cargo clippy -p ocg-core --all-targets --locked --features ollama-cloud-loopback-test -- -D warnings
      - run: pnpm run contract:v4:check
      - name: Commit generated contracts and remove one-shot workflow
        run: |
          rm .github/workflows/ocg-model-metadata-bootstrap.yml
          git add schema src/api/generated .github/workflows/ocg-model-metadata-bootstrap.yml
          git -c core.hooksPath=/dev/null commit -m 'chore: generate model metadata contract and complete feature validation'
          git push origin HEAD:refs/heads/feat/dsh-model-metadata
