name: Maintainer issue preparation
on:
  push:
    branches: [maintainer/issues-58-59-62-63-runner]
    paths: [.github/workflows/maintainer-issues.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      BASE: df8fd9b43079180273ca48a54425e7283415c2dc
      TARGET: maintainer/issue-59-reviewed
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile existing statements with the documented exception
        run: |
          set -euo pipefail
          git switch --detach "$BASE"
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'docs/user/provider-presets.md': (
                  'New Providers remain unpriced: official quota, balance and pricing are not synchronized.',
                  'Except for the matching DeepSeek/Zhipu official API presets described below, new Providers remain unpriced: official quota, balance and pricing are not synchronized.'),
              'DESIGN.md': (
                  'User-defined Providers bind Configurable HTTP, stay unpriced, and expose create/edit/delete plus optional discovery/test.',
                  'User-defined Providers bind Configurable HTTP and expose create/edit/delete plus optional discovery/test. Generic definitions remain unpriced; matching DeepSeek/Zhipu API presets use the separate official financial reference panel described below.'),
          }
          for name, (old, new) in replacements.items():
              p = Path(name)
              content = p.read_text()
              assert content.count(old) == 1, (name, content.count(old))
              p.write_text(content.replace(old, new))
          PY
          git diff --check
          git diff --stat
          test ! -e .github/workflows/maintainer-issues.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/user/provider-presets.md DESIGN.md
          git commit -m 'docs(api): qualify the official preset pricing exception'
      - name: Publish follow-up branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$BASE"
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH_HEADER"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin "HEAD:refs/heads/$TARGET"
          printf 'Reviewed candidate `%s`; main and PR branch unchanged.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
