name: Maintainer issue preparation
on:
  push:
    branches: [maintainer/issues-58-59-62-63-runner]
    paths: [.github/workflows/maintainer-issues.yml]
permissions:
  contents: write
concurrency:
  group: maintainer-issue-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      BASE: e9f38d1b8baa0dc60f9fdd50e7f063d805ca39ba
      TARGET: maintainer/issue-58-go-catalog-routing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: quality-linux
          workspaces: . -> target
          save-if: false
      - name: Prepare scoped change
        run: |
          cp .github/maintainer/issue58.py "$RUNNER_TEMP/fix.py"
          git switch --detach "$BASE"
          python "$RUNNER_TEMP/fix.py"
          cargo fmt --all
          git diff --check
      - name: Verify routing and zero-send controls
        run: |
          cargo test -p ocg-core --lib diagnostic_plan_does_not_veto --locked
          cargo test -p ocg-core --test gateway_go_catalog_models --locked
      - name: Publish feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test ! -e .github/workflows/maintainer-issues.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates docs
          git commit -m 'fix(gateway): honor runtime Go contracts before diagnostic planning (#58)'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$TARGET"
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
