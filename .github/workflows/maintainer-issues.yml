name: Maintainer issue preparation
on:
  push:
    branches: [maintainer/issues-58-59-62-63-runner]
    paths: [.github/workflows/maintainer-issues.yml]
permissions:
  contents: read
concurrency:
  group: maintainer-issue-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      BASE: fc4ed381ebf4027d867274f8880c1d4052164f77
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: quality-linux
          workspaces: . -> target
          save-if: false
      - name: Prepare scoped financial code on current main
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/issue59"
          cp .github/maintainer/issue59-*.py "$RUNNER_TEMP/issue59/"
          git switch --detach "$BASE"
          for part in core sources forward tests; do
            python "$RUNNER_TEMP/issue59/issue59-$part.py"
          done
          cargo fmt --all
          git diff --check
      - name: Test parsers, currency accounting and protected account refresh
        run: |
          cargo test -p ocg-core --lib official_api --locked
          cargo test -p ocg-core --test dashboard_v4_official_api --locked
      - name: Check real public documentation parsing without account credentials
        run: cargo test -p ocg-core --lib live_official_api_public_price_documents_parse --locked -- --ignored
