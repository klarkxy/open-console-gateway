name: Read official API reference
on:
  push:
    branches: [maintainer/issues-58-59-62-63-runner]
    paths: [.github/workflows/official-api-evidence.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fetch fixed public references without credentials
        shell: bash
        run: |
          mkdir evidence
          curl --fail --location --max-time 45 --max-filesize 5242880 https://docs.bigmodel.cn/cn/guide/start/pricing.md -o evidence/zhipu-pricing.md
          curl --fail --location --max-time 45 --max-filesize 5242880 https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3.md -o evidence/glm-5.3.md
          curl --fail --location --max-time 45 --max-filesize 5242880 https://docs.bigmodel.cn/cn/guide/models/vlm/glm-5.3-flash.md -o evidence/glm-5.3-flash.md
          sha256sum evidence/* > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: official-api-reference
          path: evidence
          retention-days: 1
