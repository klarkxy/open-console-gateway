name: Prepare PR 60 maintainer integration

on:
  push:
    branches: [maintainer/pr-60-integration-runner]
    paths:
      - .github/scripts/pr60_polish.py
      - .github/workflows/pr60-integration.yml

permissions:
  contents: write

concurrency:
  group: pr60-maintainer-preparation
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PR60_INPUT_SHA: e1f6a84bff104f0dd6a44ae583adf3207f834cb2
      PR60_TARGET: maintainer/pr-60-ready
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply final resolutions on the candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/pr60_polish.py "$RUNNER_TEMP/pr60_polish.py"
          test "$(git rev-parse origin/maintainer/pr-60-integration)" = "$PR60_INPUT_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --detach "$PR60_INPUT_SHA"
          python "$RUNNER_TEMP/pr60_polish.py"
      - name: Publish follow-up branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$PR60_INPUT_SHA"
          test ! -e .github/workflows/pr60-integration.yml
          test ! -e .github/scripts/pr60_polish.py
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH_HEADER"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin "HEAD:refs/heads/$PR60_TARGET"
          printf 'Candidate: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
