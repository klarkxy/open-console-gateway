name: Quality

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact candidate commit to validate; defaults to the triggering commit
        required: false
        type: string
        default: ""
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web tests and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.29.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run contract:v3:check
      - run: pnpm run contract:v4:check
      - run: pnpm run typecheck
      - run: pnpm run test:web
      - run: pnpm exec vite build
      - run: pnpm run design:lint
      - run: docker compose -f compose.example.yaml config --quiet

  rust:
    name: Rust tests and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - run: cargo fmt --all -- --check

      # The Linux leg excludes the Tauri desktop crate (ocg-manager): only it
      # needs WebKit headers, and the windows-tauri job already compiles, tests,
      # and lints that crate. Linux src-tauri compile coverage lives in the
      # release build matrix.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: quality-linux
          workspaces: ". -> target"
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - run: cargo test --workspace --exclude ocg-manager --locked
      - run: cargo clippy --workspace --exclude ocg-manager --all-targets --locked -- -D warnings

  windows-tauri:
    name: Windows Tauri tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: quality-windows-tauri
          workspaces: ". -> target"
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Provide stub dashboard for tauri-build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><div id="app"></div>'

      - name: Compile and test Windows-only desktop behavior
        run: cargo test -p ocg-manager --lib --locked

      - name: Lint Windows desktop crate
        run: cargo clippy -p ocg-manager --all-targets --locked -- -D warnings
