name: Quality

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact candidate commit to validate; defaults to the triggering commit
        required: false
        type: string
        default: ""
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - run: cargo fmt --all -- --check

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: quality-linux
          workspaces: ". -> target"
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - run: cargo test --workspace --locked --no-fail-fast --features ocg-core/ollama-cloud-loopback-test
      - run: cargo clippy --workspace --all-targets --locked --features ocg-core/ollama-cloud-loopback-test -- -D warnings

  windows-cli:
    name: Windows native CLI
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: quality-windows-cli
          workspaces: ". -> target"
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo test -p ocg-manager-cli --locked
      - run: cargo clippy -p ocg-manager-cli --all-targets --locked -- -D warnings
