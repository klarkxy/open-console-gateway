name: Prepare v2.4.2 main patch packages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-v2.4.2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-v2.4.2-main
  cancel-in-progress: false

jobs:
  quality:
    if: github.repository == 'klarkxy/open-console-gateway' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml

  prepare:
    name: Prepare versions and start native packages
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the reviewed main snapshot and an unused release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v2.4.1
          if git show-ref --verify --quiet refs/tags/v2.4.2; then
            echo 'v2.4.2 already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          python3 scripts/prepare-patch-v2.4.2.py --self-test
          python3 scripts/prepare-patch-v2.4.2.py

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.29.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfiles without changing registry dependencies
        run: |
          set -euo pipefail
          cargo update --workspace
          python3 scripts/prepare-patch-v2.4.2.py --verify-lock
          pnpm install --lockfile-only --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - name: Check the patch packaging inputs
        env:
          OCG_RELEASE_TAG: v2.4.2
        run: |
          set -euo pipefail
          pnpm run test:tooling
          pnpm run contract:v3:check
          pnpm run contract:v4:check
          pnpm run release:check
          git diff --check

      - name: Commit generated versions to main without rewriting history
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json Cargo.toml Cargo.lock src-tauri/Cargo.toml src-tauri/tauri.conf.json compose.example.yaml
          git diff --cached --check
          git commit -m 'chore(release): prepare v2.4.2 patch packages from main'
          gh auth setup-git
          git push origin HEAD:refs/heads/main
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'Prepared main commit: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Build all native candidates through the unchanged release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREPARED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$PREPARED_SHA"
          gh workflow run release.yml --ref main -f target=all
          printf '\nStarted Windows x64, macOS Universal and Linux x64 candidate packaging.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'This task does not create a tag, publish a GitHub Release, or change GHCR/latest. The existing signed tag-release gates remain unchanged.\n' >> "$GITHUB_STEP_SUMMARY"
