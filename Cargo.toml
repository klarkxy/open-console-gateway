[workspace]
members = [
    "crates/ocg-core",
    "crates/ocg-domain",
    "crates/ocg-gateway",
    "crates/ocg-infra",
    "crates/ocg-cli",
]
resolver = "2"

[workspace.package]
version = "2.6.4"
edition = "2024"
authors = ["ocg-manager"]
license-file = "LICENSE"
repository = ""
rust-version = "1.88.0"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
